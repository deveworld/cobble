name: Deploy Web Demo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - Cargo.lock
      - Cargo.toml
      - src/**
      - web/**
  pull_request:
    paths:
      - .github/workflows/deploy-pages.yml
      - Cargo.lock
      - Cargo.toml
      - src/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('web-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install browser dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: web
        run: npm run lint

      - name: Test WebAssembly compiler
        working-directory: web
        run: npm run test:wasm

      - name: Test data pack ZIP helper
        working-directory: web
        run: npm run test:zip

      - name: Build GitHub Pages site
        working-directory: web
        run: npm run build:github

      - name: Test browser compiler
        working-directory: web
        run: npm run test:e2e:run

      - name: Check documentation and web links
        working-directory: web
        run: npm run test:links

      - name: Upload static site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-site
          path: web/out
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-site
          path: web/out

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
