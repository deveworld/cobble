name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Documentation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check markdown links
        working-directory: web
        run: npm run test:docs-links

  rust:
    name: Rust
    runs-on: ubuntu-latest

    env:
      # data/commands.json is gitignored; without this, tests that pass
      # --validate would download a Mojang server.jar and run `java --reports`
      # to regenerate it (an undeclared network/Java dependency). Disabling
      # auto-download makes those tests skip when the file is absent.
      COBBLE_COMMANDS_JSON_AUTO_DOWNLOAD: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Package
        run: cargo package --locked

      - name: Publish dry run
        run: cargo publish --dry-run --locked
