[package]
name = "cobble"
version = "0.5.7"
edition = "2021"
authors = ["deveworld <world@worldsw.dev>"]
description = "A modern, Python-like language for creating Minecraft Data Packs"
license = "MIT"
repository = "https://github.com/deveworld/cobble"
homepage = "https://github.com/deveworld/cobble"
documentation = "https://github.com/deveworld/cobble/tree/main/docs"
keywords = ["minecraft", "datapack", "transpiler", "compiler"]
categories = ["game-engines", "command-line-utilities"]

[dependencies]
chumsky = "0.11.1"
ariadne = "0.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
walkdir = "2.5"
notify = "6.1"
zip = "2.1"

[dev-dependencies]
insta = "1.40"
tempfile = "3.8"